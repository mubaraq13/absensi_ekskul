<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Absensi Siswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light pt-5">
    
    <!-- Loading Screen -->
    <div class="loading-overlay" id="loadingScreen">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="container">
        <div class="card shadow-sm mx-auto p-4 mb-5" style="max-width: 500px;">
            <a href="index.html" class="text-decoration-none text-secondary mb-3 d-block">&larr; Kembali</a>
            <h3 class="fw-bold mb-4 text-center">Form Absensi</h3>
            
            <!-- Alert untuk Error/Sukses -->
            <div id="alertBox" class="alert d-none" role="alert"></div>

            <form id="formAbsensi">
                <!-- ID Pencarian -->
                <div class="mb-3">
                    <label class="form-label">ID nggota</label>
                    <div class="input-group">
                        <input type="text" id="idAnggota" class="form-control" placeholder="Contoh: A001" required>
                        <button class="btn btn-outline-primary" type="button" id="btnCari">Cari</button>
                    </div>
                </div>

                <!-- Bagian yang ter-disable sebelum ID ditemukan -->
                <fieldset id="formFields" disabled>
                    <div class="mb-3">
                        <label class="form-label">Nama</label>
                        <input type="text" id="namaSiswa" class="form-control bg-light" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kelas</label>
                        <input type="text" id="kelasSiswa" class="form-control bg-light" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status Kehadiran</label>
                        <select id="statusKehadiran" class="form-select" required>
                            <option value="Hadir" selected>Hadir</option>
                            <option value="Izin">Izin</option>
                            <option value="Sakit">Sakit</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Keterangan (Opsional)</label>
                        <textarea id="keterangan" class="form-control" rows="2" placeholder="Cth: Izin lomba / Sakit demam"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Submit Absensi</button>
                </fieldset>
            </form>

            <!-- Layout Berhasil Absen -->
            <div id="successPanel" class="d-none text-center py-4">
                <div class="text-success mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                      <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                    </svg>
                </div>
                <h4 class="fw-bold">ABSENSI BERHASIL</h4>
                <div class="card bg-light mt-3 text-start p-3">
                    <p class="mb-1"><strong>Nama:</strong> <span id="resNama"></span></p>
                    <p class="mb-1"><strong>Tanggal:</strong> <span id="resTanggal"></span></p>
                    <p class="mb-1"><strong>Jam:</strong> <span id="resJam"></span></p>
                    <p class="mb-0"><strong>Status:</strong> <span id="resStatus"></span></p>
                </div>
                <button class="btn btn-outline-primary mt-4" onclick="location.reload()">Absen Siswa Lain</button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="js/api.js"></script>
    <script src="js/absensi.js"></script>
</body>
</html>
