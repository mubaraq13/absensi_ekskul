<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pengurus - Sistem Absensi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <!-- Loading Screen -->
    <div class="loading-overlay" id="loadingScreen">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="container text-center">
        <div class="card shadow-sm mx-auto p-4" style="max-width: 400px;">
            <a href="index.html" class="text-decoration-none text-secondary mb-3 text-start d-block">&larr; Kembali</a>
            
            <h3 class="fw-bold mb-4">LOGIN PENGURUS</h3>
            
            <div id="alertBox" class="alert d-none" role="alert"></div>

            <form id="formLogin" class="text-start">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- Script -->
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
